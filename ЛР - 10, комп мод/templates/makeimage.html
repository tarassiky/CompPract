<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мастерская изображений</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            max-width: 600px;
            margin: 3rem auto;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            background-color: #F2F2F2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container p-4">
            <h2 class="text-center mb-4">Создай собственное изображение</h2>

            {% if message %}
            <div class="alert alert-warning mt-3">{{ message }}</div>
            {% endif %}

            <form method="POST" action="/makeimage">
                <div class="mb-3">
                    <label for="width" class="form-label">Ширина (от 1 до 5000 px)</label>
                    <input type="number" class="form-control" id="width" name="width"
                           min="1" max="5000" required>
                </div>

                <div class="mb-3">
                    <label for="height" class="form-label">Высота (от 1 до 5000 px)</label>
                    <input type="number" class="form-control" id="height" name="height"
                           min="1" max="5000" required>
                </div>

                <div class="mb-3">
                    <label for="text" class="form-label">Подпись (до 100 символов):</label>
                    <input type="text" class="form-control" id="text" name="text" maxlength="100">
                </div>

                <button type="submit" class="btn btn-success w-100">Сделать картинку</button>
            </form>
        </div>
    </div>
</body>
</html>
