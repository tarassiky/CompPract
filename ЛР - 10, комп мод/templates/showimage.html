<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои шедевры</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .image-container {
            max-width: 800px;
            margin: 2rem auto;
            text-align: center;
        }
        .generated-image {
            max-width: 100%;
            border: 1px solid #aaa;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-container my-5 py-3">
            <h2 class="mb-4">Поздравляю! Ваша картина готова.</h2>

            {% if image_url %}
            <img src="{{ image_url }}" alt="Your Artwork" class="generated-image mb-4">
            <div class="d-grid gap-2">
                <a href="{{ image_url }}" class="btn btn-info" download>Загрузить картину</a>
                <a href="/makeimage" class="btn btn-dark">Ещё одну?</a>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
